<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Lab PvP - Loading Timeline</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #0a0a0a;
            color: #00ff88;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 0.02em;
        }

        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 500px;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
        }

        .text-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 60px;
        }

        .text-block {
            margin: 0;
        }

        .main-text {
            font-size: 28px;
            font-weight: 500;
            line-height: 1.3;
            animation: glow 2s ease-in-out infinite alternate;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .secondary-text {
            font-size: 24px;
            font-weight: 500;
            line-height: 1.4;
            opacity: 0.95;
        }

        .tertiary-text {
            font-size: 22px;
            font-weight: 500;
            line-height: 1.4;
            opacity: 0.95;
        }

        .progress-container {
            padding: 40px 0;
        }

        .progress-label {
            font-size: 16px;
            margin-bottom: 10px;
            opacity: 0.8;
        }

        .progress-bar-wrapper {
            width: 100%;
            max-width: 280px;
            height: 24px;
            margin: 0 auto;
            background: #000;
            border: 2px solid #00ff88;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.4),
                        inset 0 0 15px rgba(0, 0, 0, 0.9);
        }

        .progress-bar {
            height: 100%;
            background: #00ff88;
            width: 0%;
            animation: loading 3s ease-in-out infinite;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.8);
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.3) 50%,
                transparent 100%);
            animation: shimmer 2s infinite;
        }

        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                #00ff88 50%, 
                transparent 100%);
            animation: scan 4s linear infinite;
            opacity: 0.3;
            pointer-events: none;
        }

        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(0deg, 
                    rgba(0, 255, 136, 0.03) 0px, 
                    transparent 1px, 
                    transparent 2px, 
                    rgba(0, 255, 136, 0.03) 3px);
            pointer-events: none;
            opacity: 0.1;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 20px rgba(0, 255, 136, 0.5),
                             0 0 40px rgba(0, 255, 136, 0.3);
            }
            to {
                text-shadow: 0 0 30px rgba(0, 255, 136, 0.8),
                             0 0 60px rgba(0, 255, 136, 0.4);
            }
        }

        @keyframes loading {
            0% {
                width: 0%;
            }
            50% {
                width: 70%;
            }
            100% {
                width: 0%;
            }
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(200%);
            }
        }

        @keyframes scan {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(100vh);
            }
        }

        /* Десктопная версия */
        @media (min-width: 769px) {
            .container {
                max-width: 1200px;
                padding: 60px;
            }

            .text-block {
                margin-bottom: 0;
            }

            .text-content {
                gap: 40px;
            }

            .text-content {
                gap: 50px;
            }

            .main-text {
                font-size: clamp(32px, 4vw, 48px);
            }

            .secondary-text {
                font-size: clamp(28px, 3.5vw, 40px);
            }

            .tertiary-text {
                font-size: clamp(26px, 3vw, 36px);
            }

            .progress-container {
                padding-bottom: 0;
                margin-top: 80px;
            }

            .progress-bar-wrapper {
                max-width: 600px;
                height: 40px;
            }

            .progress-label {
                font-size: 20px;
                margin-bottom: 15px;
            }
        }

        @media (max-width: 480px) {
            .main-text {
                font-size: 24px;
            }

            .secondary-text {
                font-size: 20px;
            }

            .tertiary-text {
                font-size: 19px;
            }

            .text-block {
                margin-bottom: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="noise"></div>
    <div class="scanline"></div>
    
    <div class="container">
        <div class="text-content">
            <div class="text-block main-text">
                This connection hasn't reached your timeline... yet.
            </div>
            
            <div class="text-block secondary-text">
                この接続は皆さんのタイムラインには到達していません... まだです。
            </div>
            
            <div class="text-block tertiary-text">
                Это соединение не достигло вашего таймлайна... пока что.
            </div>
        </div>
        
        <div class="progress-container">
            <div class="progress-label">??</div>
            <div class="progress-bar-wrapper">
                <div class="progress-bar"></div>
            </div>
        </div>
    </div>

    <script>
        // Добавляем небольшие случайные глитчи
        setInterval(() => {
            if (Math.random() > 0.95) {
                document.body.style.transform = `translate(${Math.random() * 4 - 2}px, ${Math.random() * 4 - 2}px)`;
                setTimeout(() => {
                    document.body.style.transform = 'translate(0, 0)';
                }, 50);
            }
        }, 100);
    </script>
</body>
</html>
